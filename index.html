<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ω-9 Chronometric Clock</title>
<style>
  body {
    font-family: monospace;
    background-color: #111;
    color: #0f0;
    padding: 20px;
  }
  pre {
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 1.2em;
  }
</style>
</head>
<body>
<h1>Ω-9 Chronometric System</h1>
<pre id="clock"></pre>

<script>
// Constants
const SECONDS_PER_MINUTE = 81;
const MINUTES_PER_HOUR = 81;
const HOURS_PER_DAY = 27;
const DAYS_PER_YEAR = 729;
const DAYS_PER_WEEK = 9;
const DAYS_PER_MONTH = 81;

// Ω-9 Month and Weekday Names
const monthNames = ["Metals","Animals","Colors","Constellations","Natural Phenomena","Geometric Forms","Rivers","States of Mind","Elements of Suffering"];
const weekDayNames = ["Axis","Flow","Harmonic","Vector","Spiral","Void","Echo","Summit","Apex"];

// Starting point for counting
const startDate = new Date(2025, 0, 1, 0, 0, 0);

function updateClock() {
    const now = new Date();
    let elapsedSeconds = Math.floor((now - startDate) / 1000);

    const secondsPerDay = HOURS_PER_DAY * MINUTES_PER_HOUR * SECONDS_PER_MINUTE;

    let totalDays = Math.floor(elapsedSeconds / secondsPerDay);
    let dayInYear = (totalDays % DAYS_PER_YEAR) + 1;

    let secondsInDay = elapsedSeconds % secondsPerDay;
    let omegaHour = Math.floor(secondsInDay / (MINUTES_PER_HOUR * SECONDS_PER_MINUTE));
    let omegaMinute = Math.floor((secondsInDay % (MINUTES_PER_HOUR * SECONDS_PER_MINUTE)) / SECONDS_PER_MINUTE);
    let omegaSecond = secondsInDay % SECONDS_PER_MINUTE;

    let omegaWeekDay = weekDayNames[(dayInYear - 1) % DAYS_PER_WEEK];
    let omegaMonthIndex = Math.floor((dayInYear - 1) / DAYS_PER_MONTH);
    let omegaMonth = monthNames[omegaMonthIndex % monthNames.length];
    let omegaRhythm = Math.floor(((dayInYear - 1) % DAYS_PER_MONTH) / DAYS_PER_WEEK) + 1;

    let output = "";
    output += `Ω-9 Year: ${Math.floor(totalDays / DAYS_PER_YEAR) + 1}\n`;
    output += `Ω-9 Month: ${omegaMonth}\n`;
    output += `Ω-9 Rhythm (week of month): ${omegaRhythm}\n`;
    output += `Ω-9 Day of Week: ${omegaWeekDay}\n`;
    output += `Ω-9 Time: ${omegaHour.toString().padStart(2,'0')}:${omegaMinute.toString().padStart(2,'0')}:${omegaSecond.toString().padStart(2,'0')}\n\n`;

    output += `Gregorian Date: ${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;

    document.getElementById("clock").textContent = output;
}

setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
